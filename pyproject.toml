[project]
name = "math-quiz"
version = "0.1.0"
description = "Live math quiz relay backend"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "quiz_relay_api:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

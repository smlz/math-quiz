name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [test, changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # `npm ci` runs every dependency's install scripts here, so this job gets
    # nothing beyond read access; only deploy-frontend can publish to Pages.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The footer shows the release tag of the built commit, if any.
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # No usable diff base (manual run, force-push, first push) => deploy.
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() {
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$@"; then echo false; else echo true; fi
          }
          # A release commit only bumps pyproject.toml, but the frontend is
          # still rebuilt so its footer picks up the new tag.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=$(changed frontend typst .github/workflows/deploy.yml)" >> "$GITHUB_OUTPUT"
          fi
          echo "backend=$(changed quiz_relay_api.py pyproject.toml uv.lock .github/workflows/deploy.yml)" >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: [test, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
